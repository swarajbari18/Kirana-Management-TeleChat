name = "kirana-telechat"
main = "src/index.ts"
compatibility_date = "2026-03-24"
compatibility_flags = ["nodejs_compat_v2"]

[browser]
binding = "BROWSER"
remote = true

[[rules]]
type = "Text"
globs = ["**/*.sql"]
fallthrough = true

[durable_objects]
bindings = [
  { name = "STORE_DO", class_name = "StoreDurableObject" }
]

[[migrations]]
tag = "v1"
new_sqlite_classes = ["StoreDurableObject"]

[[services]]
binding = "TELEGRAM_DELIVERY"
service = "kirana-telechat"
entrypoint = "TelegramDeliveryService"

# Workers Observability — logs and traces are separate features.
# Logs: console.log + invocation metadata (what we use for transport JSON).
# Traces: OpenTelemetry request spans (optional; enable separately below).
# Redeploy after changing this block.
[observability]
enabled = true
head_sampling_rate = 1

[observability.logs]
enabled = true
invocation_logs = true
head_sampling_rate = 1

[observability.traces]
enabled = true
head_sampling_rate = 1
